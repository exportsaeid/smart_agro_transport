name: smart_agro_transport
description: "سیستم مدیریت حمل و نقل هوشمند کشاورزی"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # تاریخ و زمان
  persian_datetime_picker: ^3.1.0
  shamsi_date: ^1.1.0
  intl: ^0.20.3

  # فایل و دیتابیس
  file_picker: ^8.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  open_filex: ^4.3.4
  archive: ^3.4.10
  mailer: ^6.0.1

  # PDF و چاپ
  pdf: ^3.10.4
  printing: ^5.11.1
  share_plus: ^7.2.2

  # تنظیمات
  shared_preferences: ^2.2.2

  # نقشه
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1

  # احراز هویت
  local_auth: ^2.1.8
  url_launcher: ^6.2.1

  # پس‌زمینه
  workmanager: ^0.10.7
  flutter_local_notifications: ^18.0.1

dependency_overrides:
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icon/
    - assets/images/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/vazir.ttf
          weight: 400
        - asset: assets/fonts/vazir_bold.ttf
          weight: 700